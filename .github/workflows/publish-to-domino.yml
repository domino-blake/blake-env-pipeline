name: Publish to Domino Environment

on:
  push:
    branches: [main]
    paths:
      - "demo_pkg/__init__.py"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          CURRENT=$(python3 -c "
          import re
          content = open('demo_pkg/__init__.py').read()
          print(re.search(r'__version__\s*=\s*[\"\'](.*?)[\"\']', content).group(1))
          ")

          PREVIOUS=$(git show HEAD~1:demo_pkg/__init__.py | python3 -c "
          import re, sys
          content = sys.stdin.read()
          print(re.search(r'__version__\s*=\s*[\"\'](.*?)[\"\']', content).group(1))
          ")

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $PREVIOUS -> $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged ($CURRENT), skipping publish"
          fi

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        run: |
          pip install --quiet build
          python -m build
          echo "Built artifacts:"
          ls dist/

      - name: Create GitHub release and upload wheel
        if: steps.version.outputs.changed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ steps.version.outputs.current }}
        run: |
          WHEEL=$(ls dist/*.whl)
          WHEEL_FILENAME=$(basename $WHEEL)

          gh release create "v$PKG_VERSION" \
            --title "v$PKG_VERSION" \
            --notes "demo_pkg $PKG_VERSION" \
            "$WHEEL"

          WHEEL_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v$PKG_VERSION/$WHEEL_FILENAME"
          echo "wheel_url=$WHEEL_URL" >> $GITHUB_OUTPUT
          echo "Wheel published at: $WHEEL_URL"

      - name: Publish new revision to Domino
        if: steps.version.outputs.changed == 'true'
        env:
          DOMINO_API_HOST: ${{ secrets.DOMINO_API_HOST }}
          DOMINO_API_KEY: ${{ secrets.DOMINO_API_KEY }}
          DOMINO_ENVIRONMENT_ID: ${{ secrets.DOMINO_ENVIRONMENT_ID }}
          PKG_VERSION: ${{ steps.version.outputs.current }}
          WHEEL_URL: ${{ steps.release.outputs.wheel_url }}
        run: |
          echo "Publishing demo_pkg==$PKG_VERSION to Domino environment $DOMINO_ENVIRONMENT_ID"
          echo "Installing from: $WHEEL_URL"

          # Fetch base.id from the current revision — this is what preserves the base image
          GET_STATUS=$(curl --silent --output /tmp/domino_get.json --write-out "%{http_code}" \
            --url "$DOMINO_API_HOST/v4/environments/$DOMINO_ENVIRONMENT_ID/environmentRevision" \
            --header "X-Domino-Api-Key: $DOMINO_API_KEY")
          echo "GET status: $GET_STATUS"
          echo "GET response: $(cat /tmp/domino_get.json)"

          if [ "$GET_STATUS" -lt 200 ] || [ "$GET_STATUS" -ge 300 ]; then
            echo "Error: GET environment revision failed with HTTP $GET_STATUS"
            exit 1
          fi

          BASE_REVISION_ID=$(python3 -c "import json; data=json.load(open('/tmp/domino_get.json')); print(data['base']['id'])")
          echo "Base revision ID: $BASE_REVISION_ID"

          PAYLOAD=$(python3 -c "
          import json
          print(json.dumps({
            'newEnvironmentRevision': {
              'supportsPackagePersistence': True,
              'baseRevision': {'baseRevisionId': '$BASE_REVISION_ID'},
              'workspaceTools': '',
              'supportedClusters': [],
              'dockerfileInstructions': 'RUN pip install --no-cache-dir $WHEEL_URL',
              'environmentVariables': {},
              'preSetupScript': '',
              'postSetupScript': '',
              'preRunScript': '',
              'postRunScript': '',
              'dockerArguments': [],
              'summary': '',
              'skipCache': False,
              'shouldUseVpn': False
            }
          }))
          ")
          echo "Request payload: $PAYLOAD"

          HTTP_STATUS=$(curl --silent --output /tmp/domino_response.json --write-out "%{http_code}" \
            --request POST \
            --url "$DOMINO_API_HOST/v4/environments/$DOMINO_ENVIRONMENT_ID/environmentRevision" \
            --header "X-Domino-Api-Key: $DOMINO_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")

          RESPONSE=$(cat /tmp/domino_response.json)
          echo "HTTP status: $HTTP_STATUS"
          echo "Domino API response: $RESPONSE"

          RESPONSE=$(cat /tmp/domino_response.json)
          echo "HTTP status: $HTTP_STATUS"
          echo "Domino API response: $RESPONSE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: API call failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          REVISION_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['environmentRevision']['id'])")
          echo "Revision ID: $REVISION_ID"

      - name: Wait for build to complete
        if: steps.version.outputs.changed == 'true'
        env:
          DOMINO_API_HOST: ${{ secrets.DOMINO_API_HOST }}
          DOMINO_API_KEY: ${{ secrets.DOMINO_API_KEY }}
          DOMINO_ENVIRONMENT_ID: ${{ secrets.DOMINO_ENVIRONMENT_ID }}
        run: |
          echo "Polling for build completion..."
          MAX_ATTEMPTS=40   # 40 * 30s = 20 minutes
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            STATUS=$(curl --silent --fail \
              --url "$DOMINO_API_HOST/v4/environments/$DOMINO_ENVIRONMENT_ID/environmentRevision" \
              --header "X-Domino-Api-Key: $DOMINO_API_KEY" \
              | python3 -c "import sys, json; data=json.load(sys.stdin); rev=data.get('environmentRevision', {}); print('Succeeded' if rev.get('isBuilt') else 'Building')")

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — status: $STATUS"

            case "$STATUS" in
              Succeeded)
                echo "Environment build succeeded."
                exit 0
                ;;
              Failed)
                echo "Environment build failed."
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done

          echo "Timed out waiting for environment build."
          exit 1
